<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0e" />
    <meta name="description" content="Gestão de treinos, alunos e professores da academia." />

    <!-- Instalável na tela inicial do celular.
         O <link rel="manifest"> e o registro do service worker são injetados
         pelo vite-plugin-pwa; o manifesto é declarado no vite.config.ts. -->
    <link rel="icon" type="image/png" href="/logoapp.png" />
    <link rel="apple-touch-icon" href="/logoapp.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Sys" />

    <title>Gym Sys</title>

    <!--
      Aplica o tema escolhido antes da primeira pintura. Sem isso, quem
      escolheu claro num aparelho no escuro (ou o contrário) vê um flash da
      cor errada até o React montar.
    -->
    <script>
      ;(function () {
        try {
          var tema = localStorage.getItem('gymsys.tema')
          if (tema === 'claro' || tema === 'escuro') {
            document.documentElement.setAttribute('data-theme', tema)
          }
        } catch (e) {
          /* localStorage bloqueado: segue a preferência do sistema */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
